[project]
name = "ste-lint"
version = "0.1.0"
description = "Linter for ASD-STE100 Issue 9 Simplified Technical English (independent; not affiliated with ASD)"
license = {text = "MIT"}
authors = [{name = "David Børresen", email = "github@abdavid.net"}]
requires-python = ">=3.12,<3.13"
dependencies = [
  "spacy>=3.8,<3.9",
  "pdfplumber>=0.11",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
ste = "ste_lint.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ste_lint*"]

[tool.setuptools.package-data]
ste_lint = ["data/schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["corpus: needs the real PDF or built dictionary; skipped otherwise"]
